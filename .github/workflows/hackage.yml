name: "Release"

on:
  push:
    paths:
      - .github/workflows/hackage.yml
  release:
    types:
      - created
      - published

concurrency:
  group: hackage
  cancel-in-progress: false

jobs:
  publish-to-hackage:
    name: "Publish to Hackage"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Install Stack"
        uses: haskell-actions/setup@v2
        id: install-haskell
        with:
          stack-no-global: true
          enable-stack: true
          stack-version: "latest"

      - name: Publish `wai-rate-limit`
        if: github.event_name != 'push' && startsWith(github.ref, 'refs/tags/wai-rate-limit-') && !contains(github.ref, 'redis')
        run: stack upload ./wai-rate-limit/ --candidate --no-save-hackage-creds
        env:
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USER }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}

      - name: Publish `wai-rate-limit-redis`
        if: github.event_name != 'push' && startsWith(github.ref, 'refs/tags/wai-rate-limit-redis-')
        run: stack upload ./wai-rate-limit-redis/ --candidate --no-save-hackage-creds
        env:
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USER }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}

      - name: Publish `servant-rate-limit`
        if: github.event_name != 'push' && startsWith(github.ref, 'refs/tags/servant-rate-limit-')
        run: stack upload ./servant-rate-limit/ --candidate --no-save-hackage-creds
        env:
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USER }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}
